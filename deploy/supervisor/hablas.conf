; Background workers for hablas.
;
; NOT INSTALLED ON thijssensoftware-prod, AND MUST NOT BE.
;
; On that droplet hablas runs its scheduler and queue worker from the deploy
; user's crontab, the same as cms, billr, atlas, pitch, prospect, relay, flare,
; snag, id and tempo:
;
;   * * * * * sleep 10; cd /home/deploy/hablas && php artisan schedule:run >> /dev/null 2>&1
;   * * * * * sleep 40; cd /home/deploy/hablas && flock -n storage/framework/queue.lock \
;               php artisan queue:work --stop-when-empty --max-time=50 >> storage/logs/queue.log 2>&1
;
; Installing this file there gives you a SECOND scheduler and a SECOND queue
; worker racing the cron ones. That has happened once already (HAB-88): the two
; workers drained the same jobs straight into the mail provider's
; 10-per-5-minutes cap.
;
; It also breaks the cron worker in a way that fails silently. supervisord
; opens stdout_logfile as root before dropping to user=deploy, so queue.log and
; scheduler.log end up root-owned. The cron entry runs as deploy, so its
; `>> storage/logs/queue.log` redirect then dies with Permission denied before
; queue:work ever starts. Nothing consumes the queue and nothing lands in
; failed_jobs, so it looks like there is simply no work to do. See HAB-87.
;
; Kept only for a hypothetical supervisor-based host. If you install it there,
; drop the cron entries first and make sure the log files stay writable by the
; user the cron runs as.

[program:hablas-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /home/deploy/hablas/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deploy
numprocs=1
redirect_stderr=true
stdout_logfile=/home/deploy/hablas/storage/logs/queue.log
stopwaitsecs=3600

[program:hablas-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=php /home/deploy/hablas/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deploy
numprocs=1
redirect_stderr=true
stdout_logfile=/home/deploy/hablas/storage/logs/scheduler.log
stopwaitsecs=60
